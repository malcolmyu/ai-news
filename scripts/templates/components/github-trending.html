<div class="vitem">
  <div class="vitem-content">
    <div class="vitem-title">{{ item.title }} ⭐ {{ item.stars | format_stars }} · {{ item.language }}</div>
    <div class="vitem-desc">{{ item.summary }}</div>
  </div>
  <div style="flex-shrink:0;">
    <a href="{{ item.url }}" target="_blank" style="font-size:10px;color:#2563eb;text-decoration:none;font-weight:500;">GitHub →</a>
  </div>
</div>
