# AI News System - Harness Configuration
# This file defines all constraints, styles, and behaviors for the constraint control layer

# Style Configuration
styles:
  # Theme selection: default, dark, minimal
  theme: "default"

  # Color system configuration
  colors:
    # Primary palette customization
    primary:
      base: "#0ea5e9"      # Main AI blue
      50: "#f0f9ff"
      100: "#e0f2fe"
      200: "#bae6fd"
      300: "#7dd3fc"
      400: "#38bdf8"
      500: "#0ea5e9"
      600: "#0284c7"
      700: "#0369a1"
      800: "#075985"
      900: "#0c4a6e"

    # Secondary palette customization
    secondary:
      base: "#8b5cf6"      # Main accent purple
      50: "#f5f3ff"
      100: "#ede9fe"
      200: "#ddd6fe"
      300: "#c4b5fd"
      400: "#a78bfa"
      500: "#8b5cf6"
      600: "#7c3aed"
      700: "#6d28d9"
      800: "#5b21b6"
      900: "#4c1d95"

    # Semantic colors
    semantic:
      success: "#10b981"
      warning: "#f59e0b"
      error: "#ef4444"
      info: "#3b82f6"

    # Gradient definitions
    gradients:
      primary: "linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%)"
      secondary: "linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%)"
      accent: "linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%)"
      dark: "linear-gradient(135deg, #1e293b 0%, #334155 100%)"
      ai-gradient: "linear-gradient(135deg, #0ea5e9 0%, #7c3aed 50%, #8b5cf6 100%)"

  # Font system configuration
  fonts:
    families:
      sans: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      mono: "'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace"
      serif: "'Crimson Pro', 'Source Serif Pro', Georgia, 'Times New Roman', serif"

    # Font sizes in rem
    sizes:
      xs: 0.75       # 12px
      sm: 0.875      # 14px
      base: 1.0      # 16px
      lg: 1.125      # 18px
      xl: 1.25       # 20px
      2xl: 1.5       # 24px
      3xl: 1.875     # 30px
      4xl: 2.25      # 36px
      5xl: 3.0       # 48px
      6xl: 3.75      # 60px

  # Layout system configuration
  layouts:
    # Breakpoints
    breakpoints:
      sm: "640px"
      md: "768px"
      lg: "1024px"
      xl: "1280px"
      2xl: "1536px"

    # Spacing scale in rem
    spacing:
      xs: 0.5        # 8px
      sm: 0.75       # 12px
      md: 1.0        # 16px
      lg: 1.5        # 24px
      xl: 2.0        # 32px
      2xl: 3.0       # 48px
      3xl: 4.0       # 64px
      4xl: 6.0       # 96px

# Content Validation Constraints
constraints:
  validation:
    # Summary validation
    summary_length_min: 50
    summary_length_max: 300

    # Keyword validation
    keyword_min_count: 2
    keyword_min_length: 3
    keyword_max_length: 50
    max_keyword_density: 0.05      # 5%

    # Quality thresholds
    quality_score_threshold: 0.7
    readability_target_min: 0.6
    structure_score_target_min: 0.7
    coherence_score_target_min: 0.6

    # Content length constraints (in characters)
    content_length_min: 200
    content_length_max: 10000

    # Reading time (seconds)
    reading_time_max: 600          # 10 minutes

  # Report-specific constraints
  report:
    # Required sections (case-insensitive matching)
    required_sections:
      - "executive summary"
      - "introduction"
      - "main content"
      - "conclusion"
      - "recommendations"

    # Minimum sections required
    min_section_count: 3

    # Minimum report length (characters)
    min_length: 2000

  # Thinking model constraints
  thinking:
    # Content depth
    min_word_count: 50
    max_word_count: 1000

    # Uncertainty indicators (thresholds)
    min_uncertainty_indicators: 0    # No minimum required
    max_uncertainty_indicators: 10   # Reasonable uncertainty level

    # Depth indicator targets
    min_depth_indicators: 2

# Template Configuration
templates:
  # Default templates for each content type
  default_templates:
    article: "article_summary"
    report: "research_report"
    thinking: "thinking_model"
    daily: "daily_report"
    homepage: "homepage"
    minimal: "minimal"

  # Template validation settings
  validation:
    # Enable strict template validation
    strict_validation: true

    # Required fields for each template type
    required_fields:
      article_summary: ["title", "content"]
      research_report: ["title", "content"]
      thinking_model: ["title", "content"]
      daily_report: ["title", "content"]
      homepage: ["title"]
      minimal: ["title"]

  # Template customization options
  customization:
    # Enable custom template overrides
    allow_custom_templates: true

    # Default wrapper classes
    wrapper_classes:
      report: "container mx-auto px-4"
      article: "max-w-4xl mx-auto px-4"
      thinking: "max-w-3xl mx-auto"

# Logging and Monitoring
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # Enable detailed timing logs
  enable_timing: true

  # Validation failure logging
  log_validation_failures: true

  # Quality score logging
  log_quality_scores: true

# Performance Settings
performance:
  # Enable template caching
  template_cache_enabled: true

  # CSS minification
  minify_css: false

  # Validation batch size for bulk operations
  batch_validation_size: 10

# Quality Gates
quality_gates:
  # Block content below this quality threshold
  block_threshold: 0.3

  # Require manual review below this threshold
  review_threshold: 0.6

  # Auto-approve above this threshold
  auto_approve_threshold: 0.85

  # Enable quality gates
  enabled: true

# Integration Settings
integration:
  # External stylesheet URLs to include
  external_stylesheets: []

  # Script URLs to include
  external_scripts: []

  # Analytics configuration
  analytics:
    enabled: false
    provider: ""  # "google", "mixpanel", etc.
    tracking_id: ""

# Development Settings
development:
  # Enable debug mode
  debug: false

  # Enable detailed error messages
  detailed_errors: false

  # Reload configuration on change
  auto_reload_config: true

# Metadata
metadata:
  version: "1.0.0"
  system: "AI News Harness"
  description: "Constraint control layer for AI News System"

  # Default values for optional fields
  defaults:
    author: "AI News System"
    locale: "zh-CN"
    timezone: "Asia/Shanghai"
