# AI 日报信源配置文件
# RSS 源和 HTML 源的详细配置

# RSS 订阅源配置
rss_sources:
  # 技术博客和资讯
  - name: "宝玉"
    url: "https://s.baoyu.io/feed.xml"
    category: "综合资讯"
    enabled: true
    max_articles: 3  # 限制数量以避免过多

  - name: "阮一峰博客"
    url: "http://www.ruanyifeng.com/blog/atom.xml"
    category: "技术博客"
    enabled: true
    max_articles: 3

  - name: "Tw93 Blog"
    url: "https://tw93.fun/feed.xml"
    category: "技术博客"
    enabled: true
    max_articles: 3

  - name: "AIGC Weekly"
    url: "https://aigc-weekly.agi.li/rss.xml"
    category: "AI新闻"
    enabled: true
    max_articles: 3

  - name: "LangChain Blog"
    url: "https://blog.langchain.com/rss/"
    category: "AI框架"
    enabled: true
    max_articles: 3

  - name: "Last Week in AI"
    url: "https://lastweekin.ai/feed"
    category: "AI新闻"
    enabled: true
    max_articles: 3

  - name: "GitHub Trending Daily"
    url: "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"
    category: "开源项目"
    enabled: true
    max_articles: 3  # 只取前3篇

  # WeChat 公众号源
  - name: "WeChat 1"
    url: "https://wechat2rss-production-0187.up.railway.app/feed/3926358060.xml"
    category: "综合资讯"
    enabled: true
    max_articles: 3

  - name: "WeChat 2"
    url: "https://wechat2rss.bestblogs.dev/feed/25185b01482da0f485418ecb92e208b4416712fb.xml"
    category: "综合资讯"
    enabled: true
    max_articles: 3

  - name: "OpenAI Engineering"
    url: "https://openai.com/news/rss.xml"
    description: "OpenAI Engineering blog via RSS"
    category: "AI框架"
    enabled: true
    max_articles: 3
    filter_categories: ["Engineering"]

# HTML 页面源配置
# 注意：以下站点均为 JS 渲染的 SPA，axios+jsdom 静态抓取无法获取内容
# 需要 Playwright headless 支持后启用（当前 enabled: false）
html_sources:
  - name: "Anthropic Engineering"
    url: "https://www.anthropic.com/engineering"
    description: "Anthropic 工程博客"
    category: "AI研究"
    type: html
    enabled: true
    max_articles: 2
    selector: "a[href*='/engineering/']"
    link_selector: "a[href*='/engineering/']"

# 配置参数
settings:
  # 抓取设置
  fetch_timeout: 30  # 抓取超时时间（秒）
  max_retries: 3  # 最大重试次数

  # 摘要设置
  summary_max_length: 200  # 摘要最大长度
  summary_model: "anthropic/claude-3-sonnet"  # 使用的 AI 模型

  # 过滤设置
  max_articles_per_source: 5  # 每个源最多抓取文章数（减少以控制成本和速度）
  publish_date_within_days: 3  # 抓取近三天的文章

  # 输出设置
  output_dir: "docs"  # 输出目录
  template_file: "templates/newsletter.html"  # 模板文件路径
